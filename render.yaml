services:
  # Backend API Express Service
  - type: web
    name: mini-erp-backend
    env: node
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run prisma:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: https://mini-erp-frontend.onrender.com

  # Frontend React SPA Static Site
  - type: web
    name: mini-erp-frontend
    env: static
    rootDir: frontend
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mini-erp-backend
          property: url
          suffix: /api

databases:
  # Render PostgreSQL Database
  - name: mini-erp-db
    databaseName: minierp_db
    user: minierp_user
    region: singapore
    plan: free
